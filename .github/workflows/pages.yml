name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deployment has nothing worth finishing, but an in-flight one is left alone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project sites live under /<repo>/. Set the MINIMAX_BASE repository variable to "/" for a
      # user site or a custom domain.
      MINIMAX_BASE: ${{ vars.MINIMAX_BASE || format('/{0}/', github.event.repository.name) }}
      VITE_MINIMAX_MANIFEST_URL: ${{ vars.MINIMAX_MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v4

      # Without this the build silently falls back to the same-origin development release, which
      # does not exist on Pages, and every visitor gets a download that cannot start.
      - name: Require a hosted manifest
        run: |
          if [ -z "$VITE_MINIMAX_MANIFEST_URL" ]; then
            echo "Set the MINIMAX_MANIFEST_URL repository variable to the hosted manifest URL." >&2
            echo "Pin a commit, for example:" >&2
            echo "  https://huggingface.co/<owner>/<repo>/resolve/<commit-sha>/manifest.json" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
